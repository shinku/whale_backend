# 本地开发用的容器编排（Podman / docker compose 均可）
#
# 只负责后端依赖的中间件（MySQL），Node 应用仍在宿主机上用 `npm run dev` 运行，
# 这样和 src/config/config.local.ts 里的 127.0.0.1:3306 保持一致。
#
# 只负责把数据库跑起来：库由 MYSQL_DATABASE 创建，表由应用启动时 sequelize 自动 sync，
# 因此这里不需要任何 init / migration 脚本。
#
# 常用命令（详见 README.zh-CN.md「启动本地数据库（Podman + MySQL 8）」）：
#   podman compose up -d
#   podman compose --profile tools up -d      # 额外启动 Adminer 便于看表
#   podman compose down
services:
  mysql:
    # 国内网络拉取 docker.io 较慢时，可在 .env 里覆盖成镜像站地址，例如：
    #   MYSQL_IMAGE=docker.m.daocloud.io/library/mysql:8.0
    image: docker.m.daocloud.io/library/mysql:8.0
    container_name: whale-mysql
    restart: unless-stopped
    # 参数与 src/config/config.local.ts 的 sequelize 配置对齐
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-time-zone=+08:00
      - --max-connections=200
    environment:
      # 对应 config.local.ts: username/password
      MYSQL_ROOT_PASSWORD: STARKU0303
      # 允许通过发布的端口（非容器内网）用 root 登录
      MYSQL_ROOT_HOST: '%'
      # 对应 config.local.ts: database
      MYSQL_DATABASE: whale_db
      TZ: Asia/Shanghai
    ports:
      # 只监听宿主机回环地址，避免把本地库暴露到局域网
      - '127.0.0.1:3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
volumes:
  mysql_data:
